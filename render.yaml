databases:
  - name: kabadiwala-connect-db
    databaseName: kabadiwala_connect
    user: kabadiwala_connect
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: kabadiwala-connect-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kabadiwala-connect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://your-vercel-project.vercel.app
